name: Build Storm Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The obsolete "tools" SDK package is no longer available.
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android build components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Download Winlator source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/brunodev85/winlator.git upstream
          git -C upstream submodule update --init --recursive

      - name: Apply Storm branding
        working-directory: upstream/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          s = gradle.read_text()
          old_id = "applicationId 'com.winlator'"
          new_id = "applicationId 'com.stormlauncher.android'"
          if old_id not in s:
              raise SystemExit("Could not find the original applicationId in app/build.gradle")
          gradle.write_text(s.replace(old_id, new_id, 1))

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          old_name = '<string name="app_name">Winlator</string>'
          new_name = '<string name="app_name">Storm Launcher</string>'
          if old_name not in s:
              raise SystemExit("Could not find the original app_name in strings.xml")
          strings.write_text(s.replace(old_name, new_name, 1))
          PY

      - name: Build APK
        working-directory: upstream/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Android-ARM64
          path: upstream/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
