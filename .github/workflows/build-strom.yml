
name: Build Storm Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;24.0.8215888"
          sdkmanager "cmake;3.22.1"

      - name: Download Winlator source
        run: |
          git clone --depth 1 --recurse-submodules \
            https://github.com/brunodev85/winlator.git upstream
          git -C upstream submodule update --init --recursive

      - name: Apply Storm branding
        working-directory: upstream/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          s = gradle.read_text()
          s = s.replace(
              "applicationId 'com.winlator'",
              "applicationId 'com.stormlauncher.android'"
          )
          gradle.write_text(s)

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s = s.replace(
              '<string name="app_name">Winlator</string>',
              '<string name="app_name">Storm Launcher</string>'
          )
          strings.write_text(s)
          PY

      - name: Build APK
        working-directory: upstream/app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Storm-Android-ARM64
          path: upstream/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
